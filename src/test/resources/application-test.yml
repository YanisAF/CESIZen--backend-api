spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cesizen
    username: cesizen
    password: cesizen
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  liquibase:
    change-log: db/changelog/changelog-master.xml
    enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${USERNAME_MAIL}
    password: ${PASSWORD_MAIL}

jwt:
  secret-reset: "ThisIsASuperSecureResetSecretKeyAtLeast32Chars!"
  secret-key: "a-string-secret-at-least-256-bits-long"
  expiration-time: 3600000