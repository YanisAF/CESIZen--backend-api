name: Pull Request

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 🐘 DB de test pour Spring Boot
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cesizen
          POSTGRES_PASSWORD: cesizen
          POSTGRES_DB: cesizen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # 📥 Code
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ☕ Java 21
      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 🧪 Tests + build + coverage
      - name: Build + tests Maven
        run: mvn clean verify -e -X
        env:
          # BDD
          URL: jdbc:postgresql://localhost:5432/cesizen
          USERNAME_DB: cesizen
          PASSWORD_DB: cesizen
          jwt_secret_key: test-secret-key-for-ci
          jwt_secret_reset: test-secret-reset-for-ci
          USERNAME_MAIL: test@example.com
          PASSWORD_MAIL: fake-password

      # 📊 SonarQube
      - name: Analyse SonarQube
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=CESIZen \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # 🐳 Build Docker image de l’API
      - name: Build Docker image
        run: |
          docker build -t cesizen-api:${{ github.sha }} .

      # 🧪 Test container API (smoke test)
      - name: Run API container
        run: |
          docker run -d \
            --network host \
            --name api \
            -e URL=jdbc:postgresql://localhost:5432/cesizen \
            -e USERNAME_DB=cesizen \
            -e PASSWORD_DB=cesizen \
            -e jwt_secret_key=test-secret-key-for-ci \
            -e jwt_secret_reset=test-secret-reset-for-ci \
            -e USERNAME_MAIL=test@example.com \
            -e PASSWORD_MAIL=fake-password \
            cesizen-api:${{ github.sha }}

          for i in {1..15}; do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              echo "✅ API is up!"
              exit 0
            fi
            echo "Attempt $i/15..."
            sleep 3
          done

          echo "❌ API did not start"
          docker logs api
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f api || true