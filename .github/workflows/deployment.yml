name: Deployment

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Build applicatif + packaging Docker + scan sécurité + publication
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      image_name: ${{ steps.vars.outputs.image_name }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Build du jar sans relancer les tests (déjà validés par le pipeline PR)
      - name: Build du jar
        run: mvn clean package -DskipTests

      - name: Définir le tag et le nom d'image (Docker exige des minuscules)
        id: vars
        run: |
          echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image_name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Connexion au registre GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build de l'image Docker
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }} \
            -t ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ github.ref_name }} \
            .

      # 🔒 Scan Trivy avant publication - aucune image vulnérable ne doit être poussée
      - name: Scan Trivy de l'image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Publication de l'image
        run: |
          docker push ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}
          docker push ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ github.ref_name }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }} ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:latest
            docker push ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:latest
          fi

  # 2. Déploiement automatique sur le serveur AWS EC2
  # -> Uniquement pour main (production) et les tags de release, pas pour develop
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Copie les fichiers de déploiement (compose + config Nginx) sur le serveur.
      # Le .env de production, lui, n'est jamais écrasé : il reste géré manuellement sur l'instance.
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Copie des fichiers de déploiement sur EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/cesizen.conf"
          target: "/opt/cesizen"
          strip_components: 0

      - name: Déploiement SSH sur EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/cesizen
            # Met à jour uniquement IMAGE_NAME/IMAGE_TAG dans le .env existant
            sed -i "s|^IMAGE_NAME=.*|IMAGE_NAME=${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_name }}|" .env
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}|" .env

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f