name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag de l'image à redéployer"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Rollback vers la version demandée
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/cesizen
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ github.event.inputs.version }}|" .env

            docker compose -f docker-compose.prod.yml pull cesizen-api
            docker compose -f docker-compose.prod.yml up -d cesizen-api

      - name: Confirmation
        run: echo "Rollback effectué vers la version ${{ github.event.inputs.version }}"